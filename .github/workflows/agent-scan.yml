name: Agent scan

on:
  schedule:
    # Deliberately off the hour. GitHub drops scheduled turns on public repositories at congested
    # slots, and "*/30" asks for the two busiest minutes of every hour: measured gaps between real
    # runs were 2.2 to 6 hours rather than 30 minutes. Odd minutes are GitHub's own advice.
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: agent-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AGENT_PRIVATE_KEY: ${{ secrets.AGENT_PRIVATE_KEY }}
      LICENSE_HUNTER_ADDRESS: ${{ vars.LICENSE_HUNTER_ADDRESS }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run scan
